[project]
name = "user-deletion-poc"
version = "0.1.0"
description = "Minimal Flask app to prototype user-data deletion for Invenio"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
